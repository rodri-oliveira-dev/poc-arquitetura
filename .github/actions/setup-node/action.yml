name: Setup Node.js
description: Setup Node.js with npm cache and optionally install dependencies.

inputs:
  node-version:
    description: Node.js version used by repository tooling.
    required: false
    default: "22"
  install-dependencies:
    description: Run npm ci after setup.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install Node dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: npm ci --ignore-scripts
