version: 2

# Consolidate weekly version updates across the repository's existing ecosystems.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "docker"
    directory: "/infra/nginx"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/environments/*"
      - "/infra/terraform/modules/*"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
