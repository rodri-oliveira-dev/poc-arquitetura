name: terraform-validation

on:
  push:
    branches: ["main"]
    paths:
      - "infra/terraform/**"
      - ".tflint.hcl"
      - "**/.tflint.hcl"
      - "scripts/quality/terraform/**"
      - "scripts/validate-terraform.sh"
      - ".github/workflows/terraform-validation.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".tflint.hcl"
      - "**/.tflint.hcl"
      - "scripts/quality/terraform/**"
      - "scripts/validate-terraform.sh"
      - ".github/workflows/terraform-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.5"
  TFLINT_VERSION: "v0.62.1"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Terraform init runs with backend disabled only for syntax validation;
      # this workflow does not bypass remote backend locking because it never plans or applies.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Validate Terraform and run TFLint
        run: bash ./scripts/quality/terraform/validate.sh
